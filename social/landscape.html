<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rushly × Avenue Bakery — Landscape 1200×630</title>
<link rel="stylesheet" href="social.css">
</head>
<body>

<!-- ============================================================
     FACEBOOK / LINK · 1200 × 630 (1.91:1)
     Horizontal split: text left, storefront photo right.
     Uses Angle 1 — Partnership announcement. See COPY.md for alts.
     ============================================================ -->

<div class="post fmt--landscape">
  <div class="post__inner">

    <!-- Left: text -->
    <div class="land-left">
      <header class="lockup">
        <img class="lockup__rushly" src="assets/rushly-logo_alt3.png" alt="Rushly">
        <span class="lockup__x">&times;</span>
        <span class="lockup__partner">Avenue Bakery</span>
      </header>

      <div class="post__body">
        <span class="tag">New drop-off partner</span>
        <h1 class="headline">We've teamed up with <em>Avenue Bakery</em>.</h1>
        <p class="subcopy">Drop your care package on Fourth in SLC — same-day to the Provo MTC.</p>
        <ul class="chips">
          <li>Same-day</li>
          <li>Mon&ndash;Fri</li>
          <li>Drop by 12&nbsp;PM</li>
        </ul>
      </div>

      <footer class="post__foot">
        <a class="cta" href="https://rushlymtc.com">rushlymtc.com</a>
      </footer>
    </div>

    <!-- Right: storefront photo -->
    <div class="land-right">
      <div class="photo">
        <img src="assets/avenue-bakery-on-fourth.png" alt="Avenue Bakery on Fourth storefront">
      </div>
    </div>

  </div>
</div>

</body>
</html>
