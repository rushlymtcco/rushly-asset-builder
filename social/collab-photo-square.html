<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rushly × Avenue Bakery — Collab Photo Square 1080×1080</title>
<link rel="stylesheet" href="social.css">
</head>
<body>

<!-- ============================================================
     COLLAB OVER PHOTO · SQUARE · 1080 × 1080
     --accent = partner brand color (coral for Avenue on Fourth).
     Swap: --accent, .cp__bg image, .cp__badge logo, partner name.
     Rushly mark is the tan logo (alt3) — keeps its outlines/detail
     against the dark backdrop (box not filled in).
     ============================================================ -->

<div class="post fmt--square variant--collab-photo" style="--accent:#E2876F">
  <div class="cp__bg"><img src="assets/avenue-bakery-on-fourth.png?v=3" alt=""></div>
  <div class="cp__scrim"></div>
  <div class="post__inner">
    <div class="cp__rushly"><img src="assets/rushly-logo.png?v=3" alt="Rushly"></div>
    <div class="cp__x">&times;</div>
    <div class="cp__badge"><img src="assets/logo-avenue-bakery-fourth.png?v=3" alt="Avenue Bakery on Fourth"></div>
    <div class="cp__tagline">Same-day to the Provo MTC</div>
  </div>
  <div class="collab__credit">© Rushly MTC</div>
</div>

</body>
</html>
