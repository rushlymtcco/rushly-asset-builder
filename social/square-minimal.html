<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rushly × Avenue Bakery — Square Minimal 1080×1080</title>
<link rel="stylesheet" href="social.css">
</head>
<body>

<!-- ============================================================
     SQUARE · MINIMAL / IMAGE-FORWARD · 1080 × 1080
     Big photo + lockup + one short headline + URL.
     Swap photo in .vp__photo, partner name, and the <em> accent.
     ============================================================ -->

<div class="post fmt--square variant--photo">
  <div class="vp">
    <div class="vp__photo">
      <img src="assets/avenue-bakery-on-fourth.png" alt="Avenue Bakery on Fourth storefront">
    </div>
    <div class="vp__panel">
      <header class="lockup lockup--sm">
        <img class="lockup__rushly" src="assets/rushly-logo_alt3.png" alt="Rushly">
        <span class="lockup__x">&times;</span>
        <span class="lockup__partner">Avenue Bakery</span>
      </header>
      <div class="vp__divider"></div>
      <h1 class="vp__headline">A sweeter way to <em>send love</em>.</h1>
      <div class="vp__foot">
        <span class="vp__url">rushlymtc.com</span>
        <span class="vp__meta">Now on Fourth · SLC</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
